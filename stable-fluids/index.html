<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stable Fluids — Scenarios</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Stable Fluids — Scenarios</h1>
    <p class="hint">Pick a scenario and press Play. Switch to Sandbox to paint fields freely.</p>
    <canvas id="sim" width="720" height="720"></canvas>
    <div class="controls">
      <label>Scenario
        <select id="scenario-select"></select>
      </label>
      <button id="play">Play</button>
      <button id="step">Step</button>
      <button id="reset">Reset</button>
      <label><input id="sandbox" type="checkbox"> sandbox</label>
    </div>
    <div class="controls" id="sandbox-panel" hidden>
      <label>Paint
        <select id="paint-channel"></select>
      </label>
      <span class="hint">click / drag on the canvas</span>
    </div>
    <div class="controls" id="readouts"></div>
    <p class="stats"><span id="fps">–</span> fps · <span id="grid">–</span> grid · <span id="step-ms">–</span> ms/step</p>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
