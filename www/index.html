<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>M0.1 canvas proving ground</title>
</head>
<body>
  <!--
    Canvas convention: (0,0) is top-left, x grows right, y grows down.
    See src/lib.rs doc comments on RECT_X/RECT_Y for the same note.
  -->
  <canvas id="canvas" width="200" height="150"></canvas>
  <script type="module">
    import init from './pkg/viewer.js';

    // #[wasm_bindgen(start)] in src/lib.rs runs `main()` (which calls
    // `draw("canvas")`) automatically as part of `init()`. If `draw` panics
    // (e.g. on Green's not-yet-implemented stub), `init()` rejects and we
    // record that on `window` so the headless test can see it rather than
    // just hanging or reporting an opaque timeout.
    window.__viewerReady = false;
    window.__viewerError = null;
    init()
      .then(() => { window.__viewerReady = true; })
      .catch((e) => { window.__viewerError = String(e); });
  </script>
</body>
</html>
