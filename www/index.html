<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Canvas proving ground</title>
</head>
<body>
  <!--
    Canvas convention: (0,0) is top-left, x grows right, y grows down.
    See src/lib.rs doc comments on RECT_X/RECT_Y for the same note.
  -->
  <canvas id="canvas" width="200" height="150"></canvas>
  <script type="module">
    import init, * as wasm from './pkg/viewer.js';

    // #[wasm_bindgen(start)] in src/lib.rs runs `main()` (which paints tick
    // 0) automatically as part of `init()`. If it panics, `init()` rejects
    // and we record that on `window` so the headless test can see it rather
    // than just hanging or reporting an opaque timeout.
    window.__viewerReady = false;
    window.__viewerError = null;
    window.__tickCount = 0;

    init()
      .then(() => {
        window.__viewerReady = true;

        // Exposed so the headless test can read the shared constants
        // (colour, geometry, tick interval) straight off the loaded wasm
        // module instead of re-declaring them as JS literals — the single
        // source of truth.
        window.__wasm = wasm;

        // This page owns the wall-clock timer, but Rust's tick count is
        // driven by the shared FixedTimestep harness (src/timestep.rs), not
        // incremented by a bare +1 per call. That harness decides how many
        // fixed steps have elapsed from a real elapsed-time duration, so
        // this page must measure and pass one — the actual gap since the
        // previous fire (performance.now() deltas), not a value hardcoded
        // to always equal exactly one dt. setInterval fires are themselves
        // not perfectly regular (the browser can run one late), so this
        // duration is honest, variable elapsed time, the same kind of
        // irregular input FixedTimestep's own tests exercise.
        const intervalMs = wasm.tick_interval_ms();
        let lastFireMs = performance.now();
        setInterval(() => {
          const nowMs = performance.now();
          const frameDurationSecs = (nowMs - lastFireMs) / 1000;
          lastFireMs = nowMs;
          window.__tickCount = wasm.tick_and_draw('canvas', frameDurationSecs);
        }, intervalMs);
      })
      .catch((e) => { window.__viewerError = String(e); });
  </script>
</body>
</html>
