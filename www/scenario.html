<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scenario renderer</title>
</head>
<body>
  <!--
    Paints `stone_and_water_pool()`'s grid state via `paint_scenario`, the
    wasm export mirroring index.html's `draw`/`tick_and_draw` pattern (see
    src/lib.rs). Canvas convention unchanged: (0,0) top-left, x right, y down.
  -->
  <canvas id="canvas"></canvas>
  <script type="module">
    import init, * as wasm from './pkg/viewer.js';

    window.__scenarioReady = false;
    window.__scenarioError = null;

    init()
      .then(() => {
        window.__wasm = wasm;
        wasm.paint_scenario('canvas', wasm.scenario_cell_px());
        window.__scenarioReady = true;
      })
      .catch((e) => { window.__scenarioError = String(e); });
  </script>
</body>
</html>
