[package]
name = "viewer"
version = "0.1.0"
edition = "2021"
description = "M0.1 toolchain proving ground: draws a rectangle to an HTML canvas from Rust/wasm."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Element",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "Window",
]

# M0.3 native fallback: only the native binary (src/bin/native_viewer.rs)
# needs a PNG encoder, and only on a non-wasm target — keeping it
# target-specific means it never touches the wasm32 build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "s"
